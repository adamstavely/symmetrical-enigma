[build-system]
requires = ["poetry-core>=1.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "edda-scribe"
version = "0.1.0"
description = "EDDA SCRIBE - repository analysis engine"
readme = "README.md"
packages = [{ include = "scribe", from = "." }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = ">=2.0"
httpx = ">=0.27"
pyyaml = ">=6.0"
gitpython = ">=3.1"
neo4j = ">=5.15"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=4.0"

[tool.poetry.scripts]
scribe = "cli:main"
