[build-system]
requires = ["poetry-core>=1.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "edda-api"
version = "0.1.0"
description = "EDDA REST API"
readme = "README.md"
packages = [{ include = "api", from = "." }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.109"
uvicorn = { extras = ["standard"], version = ">=0.27" }
neo4j = ">=5.15"
pydantic = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
httpx = ">=0.27"
pytest-asyncio = ">=0.23"
