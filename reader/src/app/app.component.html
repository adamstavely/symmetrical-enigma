<div class="app-shell">
  <header class="app-header">
    <a routerLink="/" class="app-brand">
      <svg class="app-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="appIconGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b8922e" />
            <stop offset="100%" stop-color="#e4bc5c" />
          </linearGradient>
        </defs>
        <rect x="4" y="14" width="14" height="10" rx="2" fill="none" stroke="url(#appIconGold)" stroke-width="1.5" />
        <rect x="14" y="6" width="14" height="10" rx="2" fill="none" stroke="url(#appIconGold)" stroke-width="1.5" opacity="0.85" />
        <path d="M11 19h4M18 11h4" stroke="url(#appIconGold)" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
      </svg>
      <h1 class="app-title">EDDA</h1>
    </a>
    <nav class="app-nav">
      <app-group-filter
        [options]="groups()"
        [value]="groupFilter()"
        (valueChange)="setGroupFilter($event)"
      />
      <app-technology-filter
        [options]="technologies()"
        [value]="technologyFilter()"
        (valueChange)="setTechnologyFilter($event)"
      />
      <app-search-bar
        [groupFilter]="groupFilter()"
        [technologyFilter]="technologyFilter()"
      />
    </nav>
  </header>
  <main class="app-main">
    <router-outlet />
  </main>
  <footer class="app-footer">
    <span>AWS icons used in accordance with <a href="https://aws.amazon.com/architecture/icons/" target="_blank" rel="noopener">AWS Architecture Icons</a> usage guidelines.</span>
  </footer>
</div>
