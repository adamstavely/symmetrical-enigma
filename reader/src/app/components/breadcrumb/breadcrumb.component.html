<nav class="breadcrumb" aria-label="Breadcrumb">
  <button type="button" class="breadcrumb-link breadcrumb-btn" (click)="goToEnterprise()">Enterprise</button>
  @if (level() === 'system' || level() === 'container') {
    <span class="breadcrumb-sep">/</span>
    <button type="button" class="breadcrumb-link breadcrumb-btn" (click)="goToSystem()">
      {{ system()?.name ?? systemId() ?? 'System' }}
    </button>
  }
  @if (level() === 'container') {
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">{{ container()?.name ?? containerId() ?? 'Container' }}</span>
  }
</nav>
